# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov pre-commit openai

      - name: 运行 pre-commit 检查
        run: pre-commit run --all-files

      - name: 运行测试并生成覆盖率报告
        run: pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=0
